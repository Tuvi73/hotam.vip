<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOTAM VIP | להשאיר חותם שמרגש</title>
    <link rel="icon" type="image/png" href="gold-seal.png">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;400;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; }
        body, html { margin: 0; padding: 0; background-color: var(--dark); color: #fff; font-family: 'Assistant', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        .hero { height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .main-seal { width: 280px; max-width: 80%; height: auto; cursor: pointer; transition: 0.6s ease-in-out; filter: drop-shadow(0 0 15px rgba(197,160,89,0.2)); border-radius: 15px; margin: 0 auto 25px auto; }
        .main-seal:hover { transform: scale(1.05); filter: drop-shadow(0 0 40px var(--gold)); }
        .hero-tagline { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 1.6rem; letter-spacing: 4px; margin: 0; }
        .services { padding: 80px 5%; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; color: var(--gold); font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 50px; letter-spacing: 3px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .card { background: rgba(15,15,15,0.8); border: 1px solid #222; position: relative; aspect-ratio: 16/10; overflow: hidden; transition: 0.5s; display: flex; align-items: flex-end; text-decoration: none; }
        .card:hover { border-color: var(--gold); transform: translateY(-8px); }
        .card-label { position: relative; z-index: 2; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 20px 10px; color: var(--gold); font-size: 1.2rem; font-weight: 700; text-align: center; }
        .cta-area { text-align: center; margin-top: 60px; }
        .forum-btn { display: inline-block; padding: 20px 60px; border: 2px solid var(--gold); color: var(--gold); text-decoration: none; font-weight: 800; font-size: 1.1rem; transition: 0.4s; letter-spacing: 2px; }
        .forum-btn:hover { background: var(--gold); color: #000; }
        @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } .main-seal { width: 220px; } .hero-tagline { font-size: 1.2rem; } }
    </style>
</head>
<body>
    <section class="hero">
        <img src="gold-seal.png" class="main-seal" alt="HOTAM VIP" onclick="document.getElementById('services-area').scrollIntoView()">
        <div class="hero-tagline">להמחיש את הרגש. להשאיר חותם.</div>
    </section>
    <section id="services-area" class="services">
        <div class="section-title">סרטי מורשת</div>
        <div class="grid">
            <a href="https://drive.google.com/file/d/1T2HytiFIO-qb4ylmN-h6H3m-UHrSaciN/view" class="card" target="_blank">
                <div class="card-label">החיבור לאמונה ולצדיקים</div>
            </a>
            <a href="https://drive.google.com/file/d/1mZ0gxlNdINopF-OKtvLCxEkcz41y4Olc/view" class="card" target="_blank">
                <div class="card-label">ההקדשה שנשארת לנצח</div>
            </a>
            <a href="https://drive.google.com/file/d/1s2DyH89_JirI0Zc_R2_0A5ngfjLtj2dy/view" class="card" target="_blank">
                <div class="card-label">האמא שתמיד ידעה לדאוג</div>
            </a>
            <a href="https://drive.google.com/file/d/1ymbeikv0c46RIyCQtSKYRour0JPtwGB_/view" class="card" target="_blank">
                <div class="card-label">החבר האבא שביקש רק אחדות</div>
            </a>
        </div>
        <div class="cta-area">
            <a href="forum.html?type=general" class="forum-btn">לבדיקת התאמה והזמנת הפקה</a>
        </div>
    </section>
    <script>
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
        window.scrollTo(0, 0);
    </script>
</body>
</html>
